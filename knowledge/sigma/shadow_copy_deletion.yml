title: Volume Shadow Copy Deletion via vssadmin or wmic
id: 3c1a9f22-3333-4c33-9e4d-3c4d5e6f7a8b
status: stable
description: >
  Detects use of vssadmin.exe or wmic.exe to delete Volume Shadow Copies, a common
  precursor to ransomware detonation intended to prevent file recovery.
references:
  - https://attack.mitre.org/techniques/T1486/
author: IR-Copilot Sample KB
date: 2024/01/01
tags:
  - attack.impact
  - attack.t1486
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains: 'delete shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains: 'shadowcopy delete'
  condition: selection_vssadmin or selection_wmic
falsepositives:
  - Legitimate backup software maintenance windows
level: critical
mitre_technique: T1486
recommended_actions:
  - Isolate host from network immediately to contain potential ransomware
  - Check for mass file rename/encryption activity
  - Verify offline backup integrity
  - Escalate to incident commander
