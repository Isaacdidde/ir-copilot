title: Suspicious PowerShell Encoded Command
id: 8f4c9c7e-1111-4a11-9c2b-1a2b3c4d5e6f
status: stable
description: >
  Detects execution of PowerShell with an encoded command parameter (-enc / -EncodedCommand),
  frequently used by adversaries to obfuscate malicious scripts and evade static detection.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: IR-Copilot Sample KB
date: 2024/01/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-enc '
      - '-EncodedCommand'
      - '-e '
      - 'FromBase64String'
  condition: selection
falsepositives:
  - Legitimate administrative scripts that use encoded commands (rare, should be allow-listed)
level: high
mitre_technique: T1059.001
recommended_actions:
  - Decode the Base64 payload to determine intent
  - Review PowerShell Operational Log (Event ID 4104) for full script block
  - Identify parent process that spawned powershell.exe
  - Check for outbound network connections initiated by the resulting process
