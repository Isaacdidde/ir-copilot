version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ir-copilot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ir-copilot-backend
    depends_on:
      - ollama
    environment:
      - IRCOPILOT_OLLAMA_BASE_URL=http://ollama:11434
      - IRCOPILOT_API_HOST=0.0.0.0
      - IRCOPILOT_API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/app/knowledge
      - ./playbooks:/app/playbooks
      - ./data:/app/data
      - ./embeddings/cache:/app/embeddings/cache
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ir-copilot-frontend
    depends_on:
      - backend
    environment:
      - IRCOPILOT_API_URL=http://backend:8000
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  ollama_data:
