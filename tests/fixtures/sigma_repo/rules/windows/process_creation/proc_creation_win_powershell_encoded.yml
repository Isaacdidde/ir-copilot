title: Suspicious PowerShell Encoded Command (Real Repo Sample)
id: 8f4c9c7e-real-4a11-9c2b-1a2b3c4d5e6f
status: test
description: Detects execution of PowerShell with an encoded command parameter.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Florian Roth
date: 2019-01-16
modified: 2023-02-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - '-enc '
            - '-EncodedCommand'
    condition: selection
falsepositives:
    - Legitimate administrative scripts
level: high
